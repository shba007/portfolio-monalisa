services:
  app:
    image: ghcr.io/shba007/portfolio-monalisa:latest
    env_file:
      - .env
    volumes:
      - psychologist-portfolio_static:/app/static
      - psychologist-portfolio_data:/app/.data
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

volumes:
  psychologist-portfolio_static:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/portfolio-monalisa/static
  psychologist-portfolio_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/portfolio-monalisa/.data

networks:
  internal:
    driver: overlay
