services:
  app:
    image: ghcr.io/shba007/portfolio-monalisa:latest@sha256:15bd3947d18622a4225f37bf9f33760ef4343e9c9488a33c1a1e471292be05b6
    env_file:
      - .env
    volumes:
      - portfolio-monalisa_static:/app/static
      - portfolio-monalisa_data:/app/.data
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

volumes:
  portfolio-monalisa_static:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/portfolio-monalisa/static
  portfolio-monalisa_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/portfolio-monalisa/.data

networks:
  internal:
    driver: overlay
